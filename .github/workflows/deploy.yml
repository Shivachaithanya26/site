name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Runs when changes are pushed to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Debug EC2 Host
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "Error: EC2_HOST is not set!"
            exit 1
          else
            echo "EC2 Host: '${{ secrets.EC2_HOST }}'"
          fi

      - name: Add EC2 host to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts || { echo "Failed to scan host keys"; exit 1; }

      - name: Copy script to EC2
        run: |
          scp script.sh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/ || { echo "SCP failed"; exit 1; }

      - name: Execute script on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "chmod +x /home/${{ secrets.EC2_USER }}/script.sh && /home/${{ secrets.EC2_USER }}/script.sh" || { echo "SSH execution failed"; exit 1; }
